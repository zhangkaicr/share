<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全局搜索 · 因果推断与机器学习中文教程库</title>
<style>
:root{--bg:#0f1116;--card:#181b22;--text:#e4e6ea;--muted:#98a0ac;--line:#2a2f3a;--accent:#5ad1a0;--accent2:#7aa2f7;--link:#7aa2f7}
[data-theme="light"]{--bg:#f7f7f5;--card:#ffffff;--text:#2c2c2a;--muted:#6b6a65;--line:#e3e2dd;--accent:#1a7f5a;--accent2:#534ab7;--link:#534ab7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.78}
.wrap{max-width:820px;margin:0 auto;padding:26px 20px 70px}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.top a{color:var(--link);text-decoration:none;font-size:14px}
h1{font-size:24px;margin:20px 0 4px}
.sub{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.srch-main{margin:22px 0}
.srch-main input{width:100%;background:var(--card);border:1px solid var(--line);color:inherit;border-radius:8px;padding:12px 15px;font-size:15px;font-family:inherit;outline:none}
.srch-main input:focus{border-color:var(--accent)}
.srch-meta{font-size:13px;color:var(--muted);margin:12px 0 8px}
.srch-list{list-style:none;margin:0;padding:0}
.sres{display:block;padding:9px 12px;border-radius:7px;text-decoration:none;color:inherit}
.srch-list .sres{border:1px solid var(--line);margin:8px 0;background:var(--card)}
.srch-list .sres:hover{border-color:var(--accent)}
.sres .c{font-size:11px;color:var(--accent);margin-bottom:2px}
.sres .s{font-size:12.5px;color:var(--accent2);margin-bottom:3px}
.sres .t{font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sres mark{background:rgba(255,200,0,.35);color:inherit;border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">&larr; 返回教程库首页</a><a href="README.md">README</a></div>
<h1>全局搜索</h1>
<div class="sub">检索全部 12 个教程库的文字内容（不含代码块）</div>
<div class="srch-main"><input type="search" id="s-page-q" placeholder="输入关键词，多个词用空格分隔（同时匹配）…" autocomplete="off" aria-label="全局搜索"></div>
<div class="srch-meta" id="s-page-meta">输入关键词开始搜索</div>
<ul class="srch-list" id="s-page-list"></ul>
</div>
<script>
(function(){
'use strict';
var IDX='search_index.json';
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hl(t,ts){var o=esc(t);ts.forEach(function(x){if(!x)return;
  o=o.replace(new RegExp('('+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');});return o;}
function terms(q){return String(q).trim().toLowerCase().split(/\s+/).filter(Boolean);}
function snip(t,ts,len){if(t.length<=len)return t;var low=t.toLowerCase(),pos=-1;
  for(var i=0;i<ts.length;i++){var p=low.indexOf(ts[i]);if(p>=0){pos=p;break;}}
  if(pos<0)pos=0;var st=Math.max(0,pos-Math.floor(len/3));
  return (st>0?'…':'')+t.slice(st,st+len)+(st+len<t.length?'…':'');}
var idx=null;
function load(cb){if(idx)return cb(idx);
  fetch(IDX).then(function(r){return r.json();}).then(function(d){
    var recs=[];
    (d.chapters||d.pages||[]).forEach(function(u){
      (u.sections||[]).forEach(function(s){
        recs.push({file:u.file,libT:u.libTitle||u.title,chapter:u.title,
          section:s.heading||'',anchor:s.anchor||'',paras:s.paras||[],
          key:(u.title+' '+(s.heading||'')).toLowerCase(),
          id:u.file+(s.anchor?'#'+s.anchor:'')});});});
    idx=recs;cb(idx);}).catch(function(){cb(null);});}
function search(q){var ts=terms(q);if(!ts.length||!idx)return [];
  var hits=[];
  for(var i=0;i<idx.length;i++){var r=idx[i];
    if(ts.every(function(t){return r.key.indexOf(t)>=0;})){
      hits.push({rec:r,score:1000,snippet:snip(r.paras[0]||r.section||r.chapter||'',ts,150)});continue;}
    for(var j=0;j<r.paras.length;j++){var low=r.paras[j].toLowerCase(),ok=true,sc=0;
      for(var k=0;k<ts.length;k++){var p=low.indexOf(ts[k]);if(p<0){ok=false;break;}
        sc+=10-Math.min(9,Math.floor(p/400));}
      if(ok)hits.push({rec:r,score:sc,snippet:snip(r.paras[j],ts,150)});}}
  hits.sort(function(a,b){return b.score-a.score;});return hits;}
function init(){
  var inp=document.getElementById('s-page-q');if(!inp)return;
  var meta=document.getElementById('s-page-meta'),list=document.getElementById('s-page-list');
  var m=location.search.match(/[?&]q=([^&]*)/);
  var q=m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';
  inp.value=q;
  function run(term){load(function(d){if(!d){meta.textContent='索引加载失败';return;}
    var hits=search(term);
    if(!term.trim()){meta.textContent='输入关键词开始搜索';list.innerHTML='';return;}
    meta.textContent=hits.length?('找到 '+hits.length+' 处结果'):('未找到「'+term+'」相关内容');
    var ts=terms(term);
    list.innerHTML=hits.map(function(h){return '<li><a class="sres" href="'+h.rec.id+'">'+
      '<div class="c">'+hl(h.rec.libT,ts)+'</div>'+
      (h.rec.section?'<div class="s">'+hl(h.rec.section,ts)+'</div>':'')+
      '<div class="t">'+hl(h.snippet,ts)+'</div></a></li>';}).join('');});}
  run(q);var t=null;
  inp.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){
    var v=inp.value.trim();
    try{history.replaceState(null,'',v?'search.html?q='+encodeURIComponent(v):'search.html');}catch(e){}
    run(v);},220);});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
